name: v0.3 scaffold smoke

on:
  pull_request:
    paths:
      - 'scripts/new_problem.ps1'
      - 'scripts/workspace_preflight.py'
      - 'scripts/audit_human_paper.py'
      - 'config/**'
      - '.github/workflows/v03-smoke.yml'

jobs:
  windows-scaffold-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python syntax
        shell: pwsh
        run: |
          python -m py_compile scripts/workspace_preflight.py scripts/audit_human_paper.py
      - name: Create v0.3 workspace
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mmkit-v03-smoke-root'
          New-Item -ItemType Directory -Force $root | Out-Null
          .\scripts\new_problem.ps1 -Name CUMCM-V03-SMOKE -DestinationRoot $root
          $ws = Join-Path $root 'CUMCM-V03-SMOKE'
          python .\scripts\workspace_preflight.py $ws
          python .\scripts\audit_human_paper.py (Join-Path $ws '06_paper\main.tex') --strict
      - name: Canonical submission invariant
        shell: pwsh
        run: |
          $ws = Join-Path (Join-Path $env:RUNNER_TEMP 'mmkit-v03-smoke-root') 'CUMCM-V03-SMOKE'
          if (-not (Test-Path (Join-Path $ws '09_submission\SUBMISSION_MANIFEST.md'))) { throw 'submission manifest missing' }
          if (-not (Test-Path (Join-Path $ws 'FINAL\README_DEPRECATED.md'))) { throw 'FINAL deprecation marker missing' }
          if (-not (Test-Path (Join-Path $ws 'config\contest_visual.yaml'))) { throw 'contest visual snapshot missing' }
          if (Get-ChildItem (Join-Path $ws 'FINAL') -File | Where-Object { $_.Name -ne 'README_DEPRECATED.md' }) { throw 'unexpected final artifact in deprecated FINAL' }
