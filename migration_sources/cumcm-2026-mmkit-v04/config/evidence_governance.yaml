version: 4
status: ACTIVE_PRECONTEST_POLICY
updated: 2026-09-09

principles:
  - evidence_strength_must_be_explicit
  - gate_approval_is_bound_to_exact_upstream_fingerprints
  - stale_evidence_invalidates_downstream_approval
  - formal_writer_reads_approved_evidence_not_chat_memory
  - model_comparisons_require_real_common_protocol_runs
  - review_independence_must_be_declared_truthfully
  - g4_locks_exact_submission_bytes
  - machine_checks_do_not_replace_human_scientific_judgment

proof_levels:
  MACHINE_VERIFIED:
    meaning: deterministic verifier actually executed against identified inputs
    requires: [verifier_identity, input_fingerprints, output_or_report]
  HUMAN_CONFIRMED:
    meaning: participant explicitly reviewed and approved the identified artifact or decision
    requires: [artifact_or_decision_identity, confirmation_record]
  SNAPSHOT_ONLY:
    meaning: existence/hash/snapshot identity was checked but semantic correctness was not proven
    requires: [fingerprint]
  UNVERIFIED:
    meaning: no sufficient verification evidence yet

reporting:
  generic_pass_without_proof_level: forbidden
  agent_self_report_is_proof: false
  scientific_truth_from_agent_summary: forbidden
  preferred_shape:
    status: PASS_OR_FAIL
    proof_level: MACHINE_VERIFIED_OR_HUMAN_CONFIRMED_OR_SNAPSHOT_ONLY_OR_UNVERIFIED
    evidence: path_or_hash_or_report

writer_contract:
  allowed_fact_sources:
    - approved_result_tables
    - claim_evidence_register
    - verified_citations
    - approved_assumptions_and_definitions
    - selected_figures_with_source_data
    - deterministic_program_outputs_bound_to_hashes
  forbidden_as_fact_sources:
    - chat_memory_alone
    - agent_self_report_alone
    - rejected_candidate_outputs
    - stale_results
    - unexecuted_code
  if_evidence_conflicts: stop_and_escalate_to_sol_or_human

pilot_comparison_contract:
  requires:
    - same_data_split
    - same_information_visibility
    - same_primary_metric
    - at_least_one_interpretable_baseline
    - actual_successful_execution_or_recorded_failure
  failed_candidate_policy: record_failure_reason_do_not_invent_metric
  complexity_preference: require_real_out_of_sample_gain_before_extra_complexity

assumption_precheck:
  major_ambiguity_requires:
    - at_least_two_plausible_interpretations
    - quick_boundary_or_small_case_check
    - downstream_question_consistency_check
    - accepted_interpretation_and_rejection_reason
  unresolved_case: HUMAN_GATE_REQUIRED
  agent_auto_choice_when_material: forbidden

review_independence:
  required_fields:
    isolated_context: boolean
    independent_implementation: boolean
    different_model_or_provider: boolean
  labels:
    fully_independent_review:
      requires: [isolated_context]
    independent_recalculation:
      requires: [independent_implementation]
    perspective_review:
      allowed_when_context_shared: true
  rule: do_not_call_role_play_multiple_independent_reviews

gate_invalidation:
  rule: any_material_upstream_fingerprint_change_marks_dependent_gate_STALE
  examples:
    G2_upstream: [problem_hash, assumption_ledger_hash, model_route_hash]
    G3_upstream: [code_tree_hash, results_tree_hash, claim_evidence_hash]
    G4_upstream: [paper_sha256, ai_detail_sha256, support_zip_sha256, submission_manifest_hash]
  stale_gate_may_be_reused: false
  byte_change_after_g4_requires_reapproval: true

checkpoint_rollback:
  preserve_verified_upstream: true
  invalidate_only_dependent_downstream: true
  restart_entire_project_by_default: false

process_ledger:
  track_for_formal_artifacts:
    - edit_origin
    - timestamp
    - resulting_fingerprint
    - verifier_to_rerun
    - dependent_gate_status
  edit_origins: [standard_script, bounded_agent_edit, human_edit, external_tool]

integrity_forensics:
  run_before_g4: true
  checks:
    - claim_table_figure_appendix_consistency
    - claimed_file_or_experiment_actually_exists
    - citation_identity_and_scope
    - internal_workflow_state_leakage
    - fabricated_verification_language
    - support_package_path_and_dependency_consistency
  ai_style_impressions:
    verdict_weight: 0
    purpose: human_reading_prompt_only
  ai_text_classifier_as_compliance_verdict: forbidden

g4_exact_file_lock:
  canonical_artifacts:
    - competition_paper.pdf
    - AI工具使用详情.pdf
    - supporting_material.zip
  requires:
    - final_human_continuous_read
    - clean_room_support_archive_test
    - anonymity_and_metadata_audit
    - secret_scan
    - exact_hashes_after_all_edits
    - standalone_ai_pdf_byte_identical_to_zip_entry
    - support_manifest_matches_archive
    - human_g4_approved_yes
  checksum_algorithms: [sha256, md5]
  after_lock_writes: forbidden
  promotion_destination: 09_submission/
  FINAL_directory_is_canonical: false

clean_room_support_policy:
  extraction_root_must_be_outside_project_tree: true
  no_absolute_local_paths: true
  no_fallback_to_original_workspace: true
  required_documentation:
    - package_map
    - required_software
    - dependencies
    - official_attachment_handling
    - run_order
    - exact_commands
  external_official_attachments:
    may_be_required: true
    must_be_documented: true
    missing_attachment_error_must_be_clear: true
  claimed_complete_runnable_program_requires_execution_evidence: true

competition_network_policy:
  after_live_problem_release:
    github_search_for_problem_or_solutions: forbidden
    new_external_skill_fetch: forbidden
    new_external_runtime_install: forbidden_unless_explicitly_approved_for_non_solution_dependency_and_rules_allow
  use_pre_frozen_local_material: true
