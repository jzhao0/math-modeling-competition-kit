# MMKit Paper Quality Policy (v0.3)
# Human-quality + competition-presentation layer added after Drill-02 review.

version: "0.3.1"
updated: "2026-09-04"

priorities:
  - scientific_truth
  - model_correctness
  - evidence_traceability
  - argument_clarity
  - human_academic_style
  - competition_visual_impact
  - figure_text_integration
  - presentation_compliance

model_evaluation:
  advantages_share_target: "0.67-0.75"
  limitations_share_target: "0.25-0.33"
  guidance: >
    Strengths and limitations must be substantive and problem-specific. Do not create
    defensive paragraphs merely to satisfy a ratio. Limitations belong in evaluation or
    discussion unless they are necessary to define the model itself.

argument_architecture:
  contribution_first: true
  evidence_bank_before_draft: true
  claim_register_before_draft: true
  section_blueprint_before_prose: true
  guidance: >
    Draft from frozen claims/evidence and a section-level argument blueprint. Do not use
    a generic competition-paper template as the primary writing engine. Each section must
    answer: what is being solved, why this model is appropriate, what mathematical object
    is introduced, what evidence/result follows, and what it means for the problem.

human_style:
  plagiarism_or_aigc_score_is_not_style_evidence: true
  claim_preserving_rewrite_required: true
  avoid_patterns:
    - repeated_defensive_negation
    - repeated_only_never_not_claim_not_report_frames
    - implementation_history_in_scientific_narrative
    - internal_audit_vocabulary
    - agent_or_model_process_vocabulary
    - excessive_parenthetical_asides
    - stock_transition_sentences
    - mechanically_symmetric_three_part_sentences
    - repeated_sentence_openings
    - excessive_em_dash_or_colon_explanations
  preferred_patterns:
    - positive_direct_scientific_statement
    - textbook_style_definition_then_derivation_then_interpretation
    - concrete_subject_and_verb
    - limitations_grouped_in_model_evaluation
    - sentence_length_and_paragraph_rhythm_variation
  parenthesis_policy: >
    Parentheses are for compact mathematical conditions, abbreviations at first use,
    equation/table/figure references, or genuinely secondary short information. If the
    parenthetical content carries reasoning, evidence, a limitation, a data-origin note,
    or a complete clause, rewrite it as a normal sentence.
  defensive_language_policy: >
    Do not write internal-review phrases such as “本文不报告…”, “绝不…”, “仅…不构成…”,
    “不在本文声明范围内” unless the distinction is indispensable to avoid a false claim.
    Prefer a positive scope statement, e.g. “本文在离散顶点集合上比较策略结构变化”.
  internal_process_policy: >
    Scientific body text must not narrate failed agents, audit stages, solver debugging,
    frozen-claim labels, internal policy names, or implementation-history details unless
    they are scientifically necessary to reproduce the method.

symbol_and_formula_exposition:
  standard_symbol_intro: "其中，x 表示……，y 表示……。"
  definition_before_use: true
  derivation_before_defense: true
  state_model_visual_trigger: true
  guidance: >
    For probabilistic or state-space models, move in the order: phenomenon/observation →
    random variables/state definition → probability or transition derivation → equation →
    interpretation → solution criterion. Use one consistent symbol-explanation grammar.
    When state/transitions are cognitively dense, pair equations with a state/transition
    diagram near the derivation rather than postponing all figures to the results section.

numeric_precision:
  default:
    abstract_decimals: 2
    prose_decimals: 2
    result_table_decimals: "2-4"
    figure_label_decimals: "2-3"
    reproducibility_appendix: "full_when_needed"
  exceptions:
    probabilities_near_acceptance_threshold: preserve_decision_relevant_precision
    hypothesis_test_or_ci_endpoints: preserve_decision_relevant_precision
    close_competitor_costs: preserve_enough_digits_to_show_ordering
  guidance: >
    Do not paste raw floating-point output into the paper. Precision must match the decision
    being communicated. Full machine precision belongs in result artifacts or appendices,
    not the abstract or explanatory prose.

range_and_list_notation:
  slash_for_parallel_numeric_results: discouraged
  tilde_for_numeric_range: discouraged
  preferred_range_notation:
    prose: "约 46%–49%"
    mathematical_interval: "[46.0%, 48.9%]"
  preferred_mapping: >
    When several parameter values map to several strategies/results, state the mapping
    explicitly in prose or a compact table instead of writing ambiguous slash-separated
    tuples.

visual_density:
  modeling_and_results_pages:
    target_visual_anchor_every_pages: "1.0-1.5"
  visual_anchor_must_support_nearby_claim_or_presentation: true
  showcase_figures_allowed: true
  guidance: >
    Density is not a quota. Evidence figures belong where their evidence is first explained;
    showcase figures may also be used to improve competition presentation when they remain
    grounded in the same verified model/result and do not invent quantitative meaning.
    Avoid a “text first, figures later” layout that forces the reader to shuttle between sections.

equations:
  require_chain:
    - definition
    - objective_or_probability_model
    - constraints_or_state_transition
    - solution_criterion
    - evaluation_metric
  guidance: >
    A model section should read as a derivation, not as an equation dump. Omit irrelevant
    links when the problem has no corresponding object. Every displayed equation must be
    referenced or explained in the surrounding argument and remain reconstructable from
    code or derivation.

figures:
  numerical_figures_must_be_data_reproducible: true
  ai_concept_figures_require_scientific_qa: true
  editable_vector_source_preferred: true
  figure_contract_required: true
  place_near_first_explanatory_use: true
  competition_aesthetics_first_class: true
  three_dimensional_plot_policy: >
    MMKit distinguishes DATA_3D from PRESENTATION_3D. DATA_3D uses a real third parameter or
    response. PRESENTATION_3D may add decorative perspective/depth to a 2D relation or categorical
    comparison purely to improve competition-paper appearance. Decorative depth must not be labeled
    as a measured variable, must not alter ordering/value perception, and should retain direct labels
    or a nearby table when exact reading matters. See config/figure_quality.yaml and
    config/contest_visual.yaml.
  guidance: >
    Every planned figure specifies intent, claim/page role, source data, visual encoding, backend,
    annotation plan and export format. Numerical truth comes from frozen data, not from rendering.
    In CUMCM, visual polish is a legitimate objective after truth and readability are protected.

latex_presentation:
  page_number_location: footer_center
  running_headers_default: false
  hyperlink_borders_visible: false
  hyperref_recommended: "\\hypersetup{hidelinks}"
  link_clickability_preserved: true
  no_reference_color_boxes: true
  no_crossref_color_boxes: true
  guidance: >
    Competition PDFs should look clean and deliberate. Keep hyperlinks functional but visually
    invisible. Page numbering must follow official CUMCM format. Running headers are disabled unless
    an official template requires them.

ai_declaration:
  body_declaration_concise: true
  detailed_roles_in_support_pdf: true
  body_guidance: >
    The paper declaration should state that AI tools were used and summarize purposes in one concise
    paragraph. Model names, orchestration roles, prompt history and detailed human verification belong
    in the required supporting AI-usage detail PDF.

code_appendix_style:
  human_research_code_style: true
  comments_explain_math_io_nonobvious_logic: true
  remove_patterns:
    - agent_handoff_history
    - internal_audit_status
    - frozen_claim_labels
    - verified_pipeline_boilerplate
    - generated_step_number_comments
    - excessive_docstrings_that_restate_code
  preserve:
    - mathematical_meaning
    - input_output_contract
    - units
    - reproducibility_parameters
    - nonobvious_algorithmic_reasoning
  guidance: >
    Submission code is scientific source code, not an agent transcript. Clean naming and short
    purpose-driven comments are preferred. Do not remove information needed for reproduction.

references:
  metadata_verification_required: true
  publisher_or_doi_verification_required: true
  guidance: >
    Follow docs/LITERATURE_VERIFICATION.md. No placeholder references or fabricated DOI.

human_final_review:
  required: true
  reviewer_view: competition_judge
  inspect:
    - first_page_and_abstract_first_impression
    - first_5_pages_argument_flow
    - obvious_ai_style_phrasing
    - decimal_and_notation_consistency
    - figure_text_integration
    - visual_rhythm_and_showcase_quality
    - page_number_and_link_box_artifacts
    - formula_exposition_and_symbol_grammar
    - appendix_code_human_readability
  rule: >
    Automated checks can establish correctness and compliance but cannot certify that the artifact
    reads like a mature competition paper. A human PDF pass must judge both scientific communication
    and visual impact before G4.

policy_meta:
  applies_to: [paper_plan, paper_draft, paper_polish, paper_gate, final_submission_qa]
  enforcement: "guidance-with-human-gate"
  deviation_log: "docs/context/DECISION_LOG.md"
