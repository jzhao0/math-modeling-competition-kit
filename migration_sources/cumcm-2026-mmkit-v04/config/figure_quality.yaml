# MMKit Figure Quality Policy (v0.3)
# Competition presentation quality is first-class, while numerical truth stays frozen.

version: "0.3.1"
updated: "2026-09-04"

editable_vector_source_preferred: true
numerical_figures_require_source_data: true
ai_generated_diagram_requires_human_qa: true
no_invented_numbers: true
no_unverified_formula_text: true
font_readability_required: true
a4_readability_required: true
place_near_first_explanatory_use: true
figure_contract_required: true

# CUMCM is a judged modeling competition, not a journal production line. A figure may therefore
# spend visual complexity purely to improve presentation, provided the decoration is clearly
# non-quantitative and does not alter the data or imply a nonexistent variable.
competition_presentation:
  aesthetics_are_a_legitimate_goal: true
  showcase_visuals_allowed: true
  decorative_depth_allowed: true
  journal_minimalism_not_required: true
  guidance: >
    Prefer figures that are both rigorous and visually memorable. Perspective, depth, gradients,
    lighting, 3D columns, ribbon/extrusion effects and spatial composition are allowed when they
    improve the competition-paper presentation. Decorative geometry must not fabricate data,
    change ordering, hide labels, or introduce a quantitative axis that has no meaning.

figure_contract_fields:
  - figure_id
  - intent
  - paper_claim_supported
  - reader_question_answered
  - source_data
  - source_result_hash_or_path
  - visual_encoding
  - backend
  - dimensions
  - units
  - presentation_layer
  - annotation_plan
  - export_format
  - editable_source
  - scientific_qa_owner

figure_classes:
  EVIDENCE_NUMERICAL:
    truth_source: frozen_result_data
    allowed_backends: [Python, R, Origin]
    exact_reading_required: true
  STRUCTURAL_SCIENTIFIC:
    truth_source: model_definition_or_verified_process
    allowed_backends: [Drawio, SVG, Python, R, Origin, reviewed_AI_draft]
  SHOWCASE_PRESENTATION:
    truth_source: nearby_verified_model_or_result
    allowed_backends: [Python, R, Origin, SVG, Drawio, reviewed_AI_draft]
    may_use_decorative_3d: true
    may_use_nonquantitative_depth: true
    rule: "展示层可以增加视觉深度，但不能新增数据含义。"

state_and_process_diagrams:
  trigger_when:
    - state_vector_has_multiple_semantic_components
    - observation_changes_belief_or_state
    - model_has_rework_or_feedback_loop
    - multistage_decision_tree_is_central
    - text_requires_repeated_stage_explanation
  placement: near_model_derivation
  guidance: >
    State-space, belief-update, return/rework and multistage models should normally include a
    compact state/transition/structure diagram when it reduces cognitive load. Equations and
    diagrams should explain the same model from complementary viewpoints.

three_dimensional_figures:
  allowed: true
  real_third_dimension_preferred_but_not_required: true
  decorative_3d_allowed: true
  modes:
    DATA_3D:
      description: "x/y/z all encode real quantities; use surface, contour, mesh, 3D scatter, etc."
      quantitative_z_axis: allowed
    PRESENTATION_3D:
      description: "depth/perspective is visual only, e.g. 3D columns or an extruded line/ribbon."
      quantitative_dummy_axis: forbidden
      requirement: "Do not label decorative depth as a measured variable; retain value labels/table when exact reading matters."
  recommended_uses:
    - "categorical comparisons: 3D columns with direct value labels"
    - "two-parameter response: 3D surface plus contour or projected slices"
    - "single trend: visually extruded/ribbon line is allowed when depth is clearly decorative"
    - "sensitivity grids: spatial surface/mesh when it improves overview"
  avoid:
    - occlusion_that_changes_apparent_order
    - perspective_that_makes_close_values_unreadable
    - fake_quantitative_depth_ticks
    - interpolation_that_invents_uncomputed_values_without_disclosure

origin_backend:
  status: OPTIONAL_RUNTIME
  primary_reference: Ge-Shun/origin-mcp
  validation_reference: Yike-Ye/OriginLab-MCP
  requirements:
    - Origin_or_OriginPro_installed
    - source_data_frozen_before_render
    - exported_figure_recorded_in_figure_plan
    - actual_origin_action_verified
    - editable_origin_project_or_reconstructable_script_preferred
  preference: >
    For showcase-quality 3D columns, surfaces, contours, fitting visualizations and polished
    competition figures, Origin may be preferred over the default Python/R renderer when it
    materially improves appearance. Python/R remains the deterministic fallback and data source.

checks:
  - figure.contract_complete: "正式图先说明用途、主张/页面作用、源数据、视觉编码和展示层"
  - figure.regenerable: "脚本/Origin项目 + 冻结数据 + seed(如适用) 可重建"
  - figure.data_truth: "所有数值和排序来自冻结结果；装饰层不改变数据"
  - figure.axes_honest: "真实量轴的刻度/单位/图例完整；装饰性深度不伪装成量轴"
  - figure.numbers_traceable: "数值来自结果文件"
  - figure.formula_text_verified: "图内公式/符号与正文和模型一致"
  - figure.font_readable: "A4打印与100% PDF阅读均可读"
  - figure.width_a4: "适配A4页宽，不溢出"
  - figure.inline_argument: "图靠近首次解释它的正文，不集中堆在后文"
  - figure.presentation_quality: "构图、层次、留白、透视和视觉焦点达到建模竞赛展示水平"
  - diagram.source_editable: "SVG/Draw.io/Origin等可编辑源归档"
  - diagram.scientific_qa: "人工核对箭头、变量、方向、单位、状态语义"
  - plot.3d_mode_declared: "3D图明确属于DATA_3D或PRESENTATION_3D；后者无伪造量轴"
  - plot.precision_consistent: "图上数值精度与正文/表格的展示精度一致"

severity: guidance
note: >
  Automated geometry checks do not replace human visual review. G4 judges both communication
  and presentation: a technically correct figure can still be visually weak, while a decorative
  3D treatment is acceptable when the underlying data remain explicit and truthful.
