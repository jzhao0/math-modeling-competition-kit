version: 1
mode: drill-first
policy:
  - Build only what is needed to complete a real practice problem.
  - Do not block progress on non-critical environment audits.
  - Fix tooling defects when they appear during a drill.
  - Deterministic code execution and human review are authoritative.

stages:
  - id: S0
    name: problem_intake
    outputs: [00_problem, STATUS.yaml]
    human_gate: G1_problem_choice
  - id: S1
    name: data_and_eda
    outputs: [02_data_processed, 03_analysis, 05_results/figures]
  - id: S2
    name: candidate_models
    outputs: [04_models, ASSUMPTION_LEDGER.md, DECISION_LOG.md]
    human_gate: G2_model_route
  - id: S3
    name: solve_and_validate
    outputs: [05_results/tables, 05_results/figures, CLAIM_EVIDENCE.csv]
    human_gate: G3_results
  - id: S3V
    name: paper_visualization
    outputs: [05_results/figures/final, 06_paper/FIGURE_MANIFEST.md, 06_paper/PAPER_VISUAL_STYLE.md]
    rule: Every main-text figure must support an explicit claim and be reproducible from saved results.
  - id: S4
    name: paper
    outputs: [06_paper/main.tex]
  - id: S5
    name: compliance_and_support
    outputs: [07_supporting, 08_ai_logs]
  - id: S6
    name: final_build
    outputs: [09_submission/paper.pdf]
    human_gate: G4_final_review
