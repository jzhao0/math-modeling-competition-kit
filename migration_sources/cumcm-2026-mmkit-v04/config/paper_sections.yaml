{
  "schema_version": 2,
  "sections": [
    {
      "section": "problem_restatement",
      "headings": ["问题重述", "问题的重述"],
      "purpose": "说明背景矛盾、数据特点与研究任务，不复制题面答案清单。",
      "manual_review_moves": ["背景矛盾", "数据特点", "研究任务"],
      "forbidden_moves": [
        {"name": "直接复制四问", "pattern": "问题[一二三四1234][：:]"},
        {"name": "明确最终模型指标", "pattern": "(?:最终模型|最终采用).{0,40}(?:AIC|BIC|p[- ]?value|p值)\\s*(?:=|为|:|：)\\s*[-+]?\\d"},
        {"name": "明确最终推荐数值", "pattern": "最终(?:推荐|建议).{0,24}(?:为|是|取|=|:|：)\\s*[-+]?\\d"}
      ]
    },
    {
      "section": "problem_analysis",
      "headings": ["问题分析", "问题的分析"],
      "purpose": "逐问交代任务、难点、数据结构与计划方案；具体语义由人工复核。",
      "manual_review_moves": ["逐问说明任务、难点、数据结构与计划方案"],
      "per_question": {
        "minimum_body_chars": 50,
        "manual_review_moves": ["任务", "难点", "数据结构", "计划方案"],
        "markers": [
          {"id": "q1", "pattern": "(?m)^[ \\t]*(?:\\d+\\.1[ \\t]+[^\\n]+|(?:问题一|第[一1]问)[：:]?[^\\n]*)$"},
          {"id": "q2", "pattern": "(?m)^[ \\t]*(?:\\d+\\.2[ \\t]+[^\\n]+|(?:问题二|第[二2]问)[：:]?[^\\n]*)$"},
          {"id": "q3", "pattern": "(?m)^[ \\t]*(?:\\d+\\.3[ \\t]+[^\\n]+|(?:问题三|第[三3]问)[：:]?[^\\n]*)$"},
          {"id": "q4", "pattern": "(?m)^[ \\t]*(?:\\d+\\.4[ \\t]+[^\\n]+|(?:问题四|第[四4]问)[：:]?[^\\n]*)$"}
        ]
      },
      "forbidden_moves": [
        {"name": "明确最终模型指标", "pattern": "(?:最终模型|最终采用).{0,40}(?:AIC|BIC|p[- ]?value|p值)\\s*(?:=|为|:|：)\\s*[-+]?\\d"},
        {"name": "明确最终推荐数值", "pattern": "最终(?:推荐|建议).{0,24}(?:为|是|取|=|:|：)\\s*[-+]?\\d"}
      ]
    },
    {
      "section": "model_assumptions",
      "headings": ["模型假设", "基本假设", "模型的假设", "模型假设与基本约定"],
      "purpose": "只陈述可解释、可检查的建模假设。",
      "forbidden_moves": [
        {"name": "代码执行规则", "pattern": "运行脚本|执行代码|随机种子写入|命令行"},
        {"name": "内部路径", "pattern": "[A-Za-z]:\\\\|(?:^|\\s)/(?:home|Users|tmp)/"},
        {"name": "明确内部Gate状态", "pattern": "(?i)(?:G[1-4]\\s+PASS|FINAL\\s+PASS|GATE_STATUS|CENTRAL_REVIEW|LOCKED\\s+RESULT|FREEZE|FROZEN)"}
      ]
    },
    {
      "section": "conclusion",
      "headings": ["结论", "总结", "结论与建议"],
      "purpose": "归纳正文对四问的回答；最终冻结数值由 paper_facts.yaml 检查。",
      "manual_review_moves": ["是否完整回答四问", "是否只使用正文已有证据与冻结结果"],
      "forbidden_moves": []
    }
  ],
  "section_boundaries": {
    "unnumbered_headings": ["AI 工具使用声明", "AI工具使用声明", "参考文献", "References", "Bibliography", "致谢"],
    "bibliography_patterns": ["(?i)references", "(?i)bibliography", "参考文献"],
    "appendix_patterns": ["附录", "(?i)appendix"]
  }
}
