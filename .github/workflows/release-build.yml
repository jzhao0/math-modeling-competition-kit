name: Release build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build frontend
        run: python -m pip install build
      - name: Validate release tag matches package version
        run: python tools/check_release_tag.py "${{ github.ref_name }}"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Audit distribution contents
        run: python tools/audit_distribution.py dist --json dist/audit.json
      - name: Install built wheel without index access
        run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist math-modeling-competition-kit
      - name: Smoke installed commands
        run: |
          mmkit --help
          mmkit-final-gate --help
          python -c "import mmkit; print(mmkit.__version__)"
          python -m pip check
      - name: Test installed package
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/audit.json
          if-no-files-found: error

# This workflow intentionally does not publish to PyPI.
# Public package publication remains a separate human gate until trusted
# publishing/authentication is configured and explicitly approved.
