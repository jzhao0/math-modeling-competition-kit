name: MVP core smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  stdlib-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package
        run: python -m compileall -q src tools tests
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py" -v

  distribution-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Audit distribution contents
        run: python tools/audit_distribution.py dist --json dist/audit.json
      - name: Install built wheel without index access
        run: python -m pip install --force-reinstall --no-deps --no-index --find-links dist math-modeling-competition-kit
      - name: Installed package smoke
        run: |
          mmkit --help
          mmkit-final-gate --help
          python -c "import mmkit; print(mmkit.__version__)"
          python -m pip check
      - name: Run full tests against installed package
        run: python -m unittest discover -s tests -p "test_*.py" -v
